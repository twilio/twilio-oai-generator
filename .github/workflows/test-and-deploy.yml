name: Unit Tests
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automatically at 8AM PST Monday-Friday
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'go', 'java', 'node', 'php', 'python', 'ruby' ]
    runs-on: ubuntu-x64
    timeout-minutes: 20
    env:
      DOCKER_LOGIN: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_AUTH_TOKEN }}
    steps:
      - name: Checkout twilio-oai-generator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Java 11
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Run unit tests
        run: make test

      - name: Run helper tests and sonar analysis
        run: make test-docker SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} LANGUAGES=${{ matrix.language }}

      - name: Show git status and fail on diff
        run: |
          git status
          git diff
          test -z "$(git status --porcelain)"

      - name: Remove pom file  # Otherwise, the Sonar action fails and recommends using the Maven plugin
        run: rm pom.xml